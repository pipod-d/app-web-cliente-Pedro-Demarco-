<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin - Elevation Sport</title>
</head>
<body>
    <header>
        <h1>Elevation Sport</h1>
        <nav>
            <ul>
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="admin.html" aria-current="page">Admin</a></li>
                <li>
                    <a href="carrito.html" class="cart-link" aria-label="Carrito de compras">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span id="cart-counter">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="admin">
        <section id="panel-admin">
            <h2>Panel de administración</h2>

            <form id="form-producto" novalidate>
                <h3>Agregar producto</h3>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required autocomplete="off">
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
                </div>

                <div class="campo">
                    <label for="url_imagen">URL de imagen</label>
                    <input type="url" id="url_imagen" name="url_imagen" placeholder="https://..." required>
                </div>

                <div class="form-acciones">
                    <button type="submit" class="btn-agregar">Guardar producto</button>
                    <button type="button" class="btn-cancelar" hidden>Cancelar edición</button>
                </div>
                <p id="estado-form" class="estado" role="status" aria-live="polite"></p>
            </form>

            <section id="lista-productos" aria-label="Productos existentes">
                <h3>Productos existentes</h3>
                <p class="estado" id="estado-lista" role="status" aria-live="polite">Cargando productos...</p>
            </section>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
