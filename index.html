<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Elevation Sport</title>
</head>
<body>
    <header>
        <h1>Elevation Sport</h1>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#contacto">Contacto</a></li>
                <li>
                    <a href="carrito.html" class="cart-link" aria-label="Carrito de compras">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span id="cart-counter">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main id="inicio">
        <section id="catalogo">
            <h2>Catálogo de productos</h2>
            <div class="catalogo-layout">
            <aside class="filtros" aria-label="Filtros de precio">
                <h3>Filtros</h3>
                <div class="filtro-campo">
                    <label for="precio-min">Precio mínimo</label>
                    <input type="number" id="precio-min" name="precio-min" min="0" step="1000" placeholder="0">
                </div>
                <div class="filtro-campo">
                    <label for="precio-max">Precio máximo</label>
                    <input type="number" id="precio-max" name="precio-max" min="0" step="1000" placeholder="0">
                </div>
            </aside>
            <div class="catalogo-resultados">
                <div class="buscador">
                    <input type="search" id="buscador-productos" placeholder="Buscar productos..." aria-label="Buscar productos" autocomplete="off">
                </div>
            </div>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="product-modal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button type="button" class="btn-cerrar modal-cerrar" aria-label="Cerrar detalle">X</button>
            <img class="modal-img" id="modal-img" alt="">
            <h3 id="modal-title"></h3>
            <p class="modal-desc" id="modal-desc"></p>
            <p class="modal-precio" id="modal-precio"></p>
            <button type="button" class="btn-agregar" id="modal-agregar">Agregar al Carrito</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
